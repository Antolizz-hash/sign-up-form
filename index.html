<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="./script/script.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="image">

            <div class="logo">

                <img src="./images/odin-lined.png" alt="photo of leaves" width="70px" height="80px">
                <p>ODIN</p>
            </div>
             
        </div>

        <div class="form-container">
            <p class="bold">This is not a real online service! You know you need something like this in your life to realize your deepest dreams. <br> Signup <em> now</em> to get started</p>
            <p class="bold">You <em>know</em> you want to.</p>
            <form action="" method="get" class="sign-up-form">
                <caption><p class="caption bold">Let's do this</p></caption><br>

                <div class="rows first-row">

                    <div class="inner1">

                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name">

                    </div>
                    <div class="inner2">

                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>

                </div>

                 <div class="rows second-row">

                    <div class="inner1">

                        <label for="email">EMAIL</label>
                        <input type="text" name="email" id="email">

                    </div>
                    <div class="inner2">
                        
                        <label for="phone">PHONE NUMBER</label>
                        <input type="text" name="phone" id="phone">
                    </div>
                  
                </div>

                 <div class="rows third-row">

                    <div class="inner1">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">

                    </div>
                    <div class="inner2">
                        
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-password" id="confirm-password">
                    </div>     
            </form>

        </div>
        <button class="submitBtn" type="submit">Create Account</button>

        <p class="hasAccount">Already have an account? Log in</p>
    </div>
    
</body>
</html>
